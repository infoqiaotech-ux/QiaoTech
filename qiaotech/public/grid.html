<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: monospace; }
  .container { position: relative; width: 800px; height: 800px; }
  img { width: 100%; height: 100%; object-fit: contain; }
  .grid {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: repeat(20, 1fr);
    pointer-events: none;
  }
  .cell { border: 1px solid rgba(255,0,0,0.5); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 10px; color: red; }
</style>
</head>
<body>
<div class="container">
  <img src="/my_logo.png" />
  <div class="grid" id="grid"></div>
</div>
<script>
  const grid = document.getElementById('grid');
  for (let y = 0; y < 20; y++) {
    for (let x = 0; x < 20; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = `${x},${y}`;
      grid.appendChild(cell);
    }
  }
</script>
</body>
</html>
